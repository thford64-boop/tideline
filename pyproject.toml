[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tideline"
description = "A non-linear video editor for Linux built on MLT and GTK 4"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dynamic = ["version"]
# PyGObject, numpy and the MLT bindings come from the distribution
# (python-gobject, python-numpy, mlt), not from PyPI.
dependencies = []

[project.gui-scripts]
tideline = "tideline.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "tideline.VERSION"}

[tool.setuptools.packages.find]
include = ["tideline*"]

[tool.setuptools.package-data]
tideline = ["data/presets/*.tlpreset", "data/icons/hicolor/*/apps/*"]
